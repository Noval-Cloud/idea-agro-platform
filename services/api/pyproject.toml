[project]
name = "idea-agro-api"
version = "0.1.0"
description = "The public API of IDEA-Agro"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.161.1",
  "google-auth[requests]==2.62.0",
  "google-cloud-firestore==2.34.1",
  "google-cloud-storage==3.17.1",
  "pyjwt[crypto]==2.15.1",
  "pyproj==3.8.0",
  "shapely==2.2.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0"]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"
