packages:
  - apps/*
  - packages/*

# Fail on a Node version outside `engines`, so the pin in .node-version is enforced.
engineStrict: true

catalog:
  astro: 7.4.0
  "@astrojs/check": 0.9.10
  "@astrojs/react": 7.1.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  cmdk: 1.1.1
  culori: 4.0.2
  d3-geo: 3.1.1
  fflate: 0.8.3
  firebase: 13.1.0
  flag-icons: 7.5.0
  lucide-react: 1.52.0
  "@lucide/astro": 1.59.0
  maplibre-gl: 6.12.0
  orval: 8.44.0
  radix-ui: 1.8.1
  react-dom: 19.3.1
  react: 19.3.1
  sharp: 0.35.5
  shpjs: 6.2.0
  tailwind-merge: 3.7.0
  "@tailwindcss/vite": 4.3.3
  tailwindcss: 4.3.3
  "@tanstack/react-query": 5.104.5
  terra-draw-maplibre-gl-adapter: 1.4.1
  terra-draw: 1.36.0
  "@tmcw/togeojson": 7.1.2
  "@types/culori": 4.0.1
  "@types/d3-geo": 3.1.1
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  typescript: 6.0.3
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  zod: 4.6.7

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Install scripts nothing here needs: esbuild's binary comes as an optional dependency, and the others
# set up Firebase Hosting defaults or check versions.
allowBuilds:
  esbuild: false
  "@firebase/util": false
  protobufjs: false
