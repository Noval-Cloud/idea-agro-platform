packages:
  - apps/*
  - packages/*

# Fail on a Node version outside `engines`, so the pin in .node-version is enforced.
engineStrict: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
