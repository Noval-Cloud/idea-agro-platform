# Included in the server and in every location: nginx drops the server's add_header where a location sets its own.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# The rest of the policy is a <meta> in each page, with the hashes of its own scripts.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
# Sign-in opens the provider's window, which reports back to this page.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# A preview for researchers: kept out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
