server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind Cloud Run's proxy: keep redirects (e.g. /explore → /explore/) relative.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/csv application/javascript application/json image/svg+xml;

  error_page 404 /404.html;

  # A preview for researchers: kept out of search engines.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Hashed and versioned files never change.
  location ~ ^/(_astro|vendor)/ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /explorer/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
