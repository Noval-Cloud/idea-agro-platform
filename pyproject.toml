[project]
name = "idea-agro-platform"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[tool.uv]
required-version = "~=0.13.5"
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = ["pyright==1.1.414", "pytest==9.1.1", "ruff==0.16.10"]

[tool.ruff]
target-version = "py314"
line-length = 120
# Python only: Markdown and the rest are formatted by Vite+.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["services"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
