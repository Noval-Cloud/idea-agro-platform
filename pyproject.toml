[project]
name = "idea-agro-platform"
version = "0.0.0"
requires-python = ">=3.15,<3.16"

[tool.uv]
required-version = "~=0.13.5"
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = ["pyright==1.1.414", "pytest==9.1.1", "ruff==0.17.1", "shellcheck-py==0.11.0.1"]

[tool.ruff]
target-version = "py315"
line-length = 120
# Python only: Markdown and the rest are formatted by Vite+.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["services", "scripts", "infrastructure"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["scripts", "services/api/tests", "services/jobs/tests"]
